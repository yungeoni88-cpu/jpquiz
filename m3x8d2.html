<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 단어T</title>
  
  <!-- 웹 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Square+Round:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- 스타일시트 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lock.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<div class="container">

  <!-- 시작 전 인트로 명언 화면 -->
  <div id="introScreen" class="quiz-box intro-card">
    <div class="intro-icon">🔥</div>
    <div class="intro-quote-box">
      <div class="intro-japanese" id="introJpQuote">-</div>
      <div class="intro-korean" id="introKoQuote">-</div>
    </div>
    <button type="button" class="btn-start-quiz" onclick="startQuiz()">시작하기 ➔</button>
  </div>

  <!-- 메인 퀴즈 화면 -->
  <div id="mainApp" style="display: none;">
    <header>
      <div class="title-box">
        <span class="badge">고등학교 일본어</span>
        <h1>2학기 기말고사 단어 퀴즈</h1>
      </div>
    </header>

    <div class="tab-container">
      <button class="tab-btn active" id="btnTabWord" onclick="changeMode('word')">💡 단어 뜻</button>
      <button class="tab-btn" id="btnTabSent" onclick="changeMode('sentence')">🧩 블록 나열</button>
    </div>

    <!-- 1. 단어 맞히기 -->
    <div id="wordQuizArea" class="quiz-box">
      <div class="info-header">
        <span style="font-weight:800; color:var(--board-green);">💡 단어 랜덤 퀴즈</span>
        <span>진행 <b id="wordCount">0</b> | 정답 <b id="wordScore" style="color:#059669;">0</b></span>
      </div>

      <div class="hiragana-board">
        <div class="hiragana-word">
          <span id="targetHiragana">-</span>
          <button class="voice-btn" onclick="speakCurrentWord()" title="발음 듣기">🔊</button>
        </div>
      </div>

      <div class="options-list" id="optionsBox"></div>
      <div class="feedback-text" id="wordFeedback"></div>

      <div class="button-group">
        <button class="action-btn btn-check" id="btnCheckWord" onclick="checkWord()">정답 확인</button>
        <button class="action-btn btn-next" id="btnNextWord" onclick="nextWord()" disabled>다음 문제 ➔</button>
      </div>
    </div>

    <!-- 2. 문장 블록 나열 영역 -->
    <div id="sentQuizArea" class="quiz-box" style="display: none;">
      <div class="info-header">
        <span style="color:var(--board-green); font-weight:800;">🧩 문장 랜덤 퀴즈</span>
        <span>진행 문제 <b id="sentCount">0</b></span>
      </div>

      <div class="korean-hint" id="targetKorean">한국어 뜻이 표시됩니다</div>

      <div class="section-label">만든 문장 (터치하면 아래로 돌아갑니다):</div>
      <div class="answer-tray" id="answerTray"></div>

      <div class="section-label">단어 블록을 순서대로 터치하세요:</div>
      <div class="block-shelf" id="blockShelf"></div>

      <div class="feedback-text" id="sentFeedback"></div>

      <div class="button-group">
        <button class="action-btn btn-check" onclick="resetSentenceBlocks()">다시 놓기</button>
        <button class="action-btn btn-check" id="btnCheckSent" onclick="checkSentence()">정답 확인</button>
        <button class="action-btn btn-next" id="btnNextSent" onclick="nextSentence()" disabled>다음 문제 ➔</button>
      </div>
    </div>

  </div>

</div>

<!-- 자바스크립트 모듈 -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/word-quiz.js"></script>
<script src="js/sentence-quiz.js"></script>

</body>
</html>
